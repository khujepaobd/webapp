<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>খুঁজে পাও — Khuje Pao</title>

  <meta
    name="description"
    content="হারানো জিনিস, ফিরে পাওয়ার সহজ পথ। Khuje Pao বাংলাদেশের Lost & Found platform."
  >

  <meta name="theme-color" content="#0b6b3a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Bengali",
        sans-serif;
      background:
        linear-gradient(145deg, #f4fff8, #ffffff);
      color: #17231c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(11,107,58,.12);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(0,0,0,.08);
    }

    .logo {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      color: #075c32;
    }

    .tagline {
      color: #607066;
      font-size: 16px;
      margin-bottom: 28px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #087f42;
      color: white;
    }

    .secondary {
      background: #eaf7ef;
      color: #075c32;
    }

    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 14px;
      background: #f4f7f5;
      color: #66736b;
      font-size: 14px;
    }

    footer {
      margin-top: 24px;
      font-size: 13px;
      color: #7b877f;
    }
  </style>
</head>

<body>

  <main class="app">

    <img
      class="logo"
      src="https://pockethostbd.github.io/drive-one/picture/khuje-pao-logo.png"
      alt="Khuje Pao Logo"
      onerror="this.style.display='none'"
    >

    <h1>খুঁজে পাও</h1>

    <p class="tagline">
      হারানো জিনিস, ফিরে পাওয়ার সহজ পথ।
    </p>

    <div class="buttons">

      <button class="primary" onclick="comingSoon()">
        🔎 হারানো জিনিস খুঁজুন
      </button>

      <button class="secondary" onclick="comingSoon()">
        📦 হারানো জিনিস রিপোর্ট করুন
      </button>

      <button class="secondary" onclick="comingSoon()">
        🤝 পাওয়া জিনিস রিপোর্ট করুন
      </button>

      <button class="secondary" onclick="comingSoon()">
        🔐 Login / Register
      </button>

    </div>

    <div class="status">
      Khuje Pao এখন সেটআপ করা হচ্ছে।
      শীঘ্রই সম্পূর্ণ Lost & Found system চালু হবে।
    </div>

    <footer>
      © 2026 Khuje Pao · Bangladesh
    </footer>

  </main>

  <script>
    function comingSoon() {
      alert("এই ফিচারটি পরবর্তী ধাপে চালু করা হবে।");
    }
  </script>

</body>
</html>
